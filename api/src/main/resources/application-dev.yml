# 模块1：开发MySQL配置文件（不包含已提交的凭据）。
# 功能：仅从环境变量读取连接详细信息。
# 技术栈：Spring Boot profiles + MySQL Connector/J + Flyway。
spring:
  datasource:
    url: ${BRRP_DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${BRRP_DB_USERNAME}
    password: ${BRRP_DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
platform:
  data-source:
    allowed-hosts: ${BRRP_DATASOURCE_ALLOWED_HOSTS:localhost,127.0.0.1}
    allow-private-addresses: ${BRRP_DATASOURCE_ALLOW_PRIVATE:true}

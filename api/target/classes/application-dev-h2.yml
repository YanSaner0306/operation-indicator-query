# 模块1：用于零依赖开发的本地/测试配置文件。
# 功能：运行Flyway认证迁移，同时由Hibernate维护已有的本体/规则模式。
# 技术栈：Spring Boot Profile + H2 MySQL兼容模式 + JPA + Flyway。
spring:
  datasource:
    url: jdbc:h2:mem:ontology;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console

platform:
  security:
    jwt-secret: VGhpcy1pcy1hLXRlc3Qta2V5LXdpdGgtMzItYnl0ZXMhIQ==
    refresh-cookie-secure: false
    api-key-pepper: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  data-source:
    encryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    allowed-hosts: localhost,127.0.0.1
    allow-private-addresses: true
